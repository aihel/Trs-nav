<!DOCTYPE html><html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Türkçe Yazılı Hazırlık</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #1e1e2f, #2c2c54);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      flex-direction: column;
    }.container {
  animation: fadeIn 0.6s ease;

  background: rgba(0,0,0,0.6);
  padding: 20px;
  border-radius: 20px;
  box-shadow: 0 0 20px rgba(0,0,0,0.5);
  text-align: center;
  width: 95%;
  max-width: 500px;
}

input, select {
  padding: 10px;
  width: 80%;
  border-radius: 10px;
  border: none;
  margin-top: 10px;
}

button {
  margin: 5px;
  padding: 10px 15px;
  border-radius: 10px;
  border: none;
  background: #6c5ce7;
  color: white;
  font-size: 14px;
  cursor: pointer;
}

.hidden { display: none; }

iframe {
  width: 100%;
  height: 400px;
  border-radius: 10px;
  margin-top: 10px;
  border: none;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px);} 
  to { opacity: 1; transform: translateY(0);} 
}

button:hover {
  transform: scale(1.05);
  background: #a29bfe;
}

.controls {
  margin-top: 10px;
}

.footer {
  position: fixed;
  bottom: 10px;
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 14px;
}

.footer img {
  width: 25px;
}

  </style>
</head>
<body><div class="container" id="loginBox">
  <h2>🔒 Giriş Yap </h2>
  <input type="password" id="password" placeholder="Şifre gir">
  <br>
  <button onclick="login()">Giriş</button>
</div><div class="container hidden" id="menu">
  <h2>Çalışma Seç</h2>
  <button onclick="showPDF()">PDF'den Çalış</button>
  <button onclick="showTest()">Test Çöz</button>
</div><div class="container hidden" id="pdfSection">
  <h3>PDF Çalışma</h3>  <select id="pdfSelect" onchange="resetPDF()">
    <option value="Sınav(Dızlama).pdf">1.pdf</option>
    <option value="Sınav(kopya).pdf">1(kopya).pdf</option>
    <option value="deneme(Test).pdf">deneme.pdf</option>
  </select>  <div class="controls">
    <button onclick="prevPage()">⬅ Sayfa</button>
    <button onclick="nextPage()">Sayfa ➡</button>
    <br>
    <button onclick="zoomOut()">➖ Zoom</button>
    <button onclick="zoomIn()">➕ Zoom</button>
  </div>  <iframe id="pdfViewer"></iframe>
</div><div class="container hidden" id="testSection">
  <h3>Sorular</h3>
  <div id="qaBox"></div>
</div><div class="footer">
  <img src="https://upload.wikimedia.org/wikipedia/commons/a/a5/Instagram_icon.png">
  <span>Lukarixyz</span>
</div><script>
  const PASSWORD = "Lukarixyz";

  function login() {
    const pass = document.getElementById("password").value;
    if(pass === PASSWORD) {
      document.getElementById("loginBox").classList.add("hidden");
      document.getElementById("menu").classList.remove("hidden");
    } else {
      alert("Yanlış şifre!");
    }
  }

  function showPDF() {
    hideAll();
    document.getElementById("pdfSection").classList.remove("hidden");
    resetPDF();
  }

  function showTest() {
    hideAll();
    document.getElementById("testSection").classList.remove("hidden");
    nextQuestion();
  }

  function hideAll() {
    document.getElementById("menu").classList.add("hidden");
    document.getElementById("pdfSection").classList.add("hidden");
    document.getElementById("testSection").classList.add("hidden");
  }

  let page = 1;
  let zoom = 100;

  function resetPDF() {
    page = 1;
    zoom = 100;
    loadPDF();
  }

  function loadPDF() {
    const pdf = document.getElementById("pdfSelect").value;
    document.getElementById("pdfViewer").src = pdf + "#page=" + page + "&zoom=" + zoom;
  }

  function nextPage() {
    page++;
    loadPDF();
  }

  function prevPage() {
    if(page > 1) page--;
    loadPDF();
  }

  function zoomIn() {
    zoom += 10;
    loadPDF();
  }

  function zoomOut() {
    if(zoom > 50) zoom -= 10;
    loadPDF();
  }

  const questions = [
  {q:"Cümlede yüklem nedir? 'Ali bugün okula erken geldi.'", a:"geldi"},
  {q:"Aşağıdakilerden hangisi isimdir? (koşmak / kitap / güzel)", a:"kitap"},
  {q:"Fiil nedir?", a:"İş, oluş veya hareket bildiren kelimelerdir."},
  {q:"Zamir nedir?", a:"İsmin yerini tutan kelimelerdir."},
  {q:"Özne nedir?", a:"İşi yapan varlıktır."},
  {q:"Nesne nedir?", a:"Yüklemden etkilenen ögedir."},
  {q:"Zarf nedir?", a:"Fiili niteleyen kelimelerdir."},
  {q:"Sıfat nedir?", a:"İsimleri niteleyen kelimelerdir."},
  {q:"Bağlaç nedir?", a:"Cümleleri bağlayan kelimelerdir."},
  {q:"'mutlu' eş anlamlısı nedir?", a:"sevinçli"},
  {q:"'büyük' zıt anlamlısı nedir?", a:"küçük"},
  {q:"'Hızlıca koştu' zarf nedir?", a:"Hızlıca"},
  {q:"'Kırmızı araba' sıfat nedir?", a:"kırmızı"},
  {q:"'Elif kitabı okudu' nesne nedir?", a:"kitabı"},
  {q:"'Biz sinemaya gittik' yüklem nedir?", a:"gittik"},
  {q:"Aşağıdakilerden hangisi zamirdir? (ben / masa)", a:"ben"},
  {q:"Aşağıdakilerden hangisi fiildir? (yazmak / kalem)", a:"yazmak"},
  {q:"İsim tamlaması nedir?", a:"İki ismin anlam ilişkisi kurmasıdır."},
  {q:"'Yavaş yürüdü' zarf nedir?", a:"yavaş"},
  {q:"Aşağıdakilerden hangisi bağlaçtır? (ve / ev)", a:"ve"},

  {q:"'Ahmet topu attı' özne nedir?", a:"Ahmet"},
  {q:"'Kalem kırıldı' yüklem nedir?", a:"kırıldı"},
  {q:"'Güzel çiçek' sıfat nedir?", a:"güzel"},
  {q:"'Onu gördüm' zamir nedir?", a:"onu"},
  {q:"'Koşarak geldi' zarf nedir?", a:"koşarak"},
  {q:"'Ali ve Veli geldi' bağlaç nedir?", a:"ve"},
  {q:"'Masada kitap var' isim nedir?", a:"kitap"},
  {q:"'Hızlı araba geçti' sıfat nedir?", a:"hızlı"},
  {q:"'Yemek yedi' fiil nedir?", a:"yedi"},
  {q:"'Çok güzel yazdı' zarf nedir?", a:"çok"},

  {q:"'Ben okula gidiyorum' zamir nedir?", a:"ben"},
  {q:"'Sarı elma' sıfat nedir?", a:"sarı"},
  {q:"'Topu tuttu' nesne nedir?", a:"topu"},
  {q:"'Hemen geldi' zarf nedir?", a:"hemen"},
  {q:"'Ali kitap okudu' yüklem nedir?", a:"okudu"},
  {q:"'Ev büyük' sıfat nedir?", a:"büyük"},
  {q:"'O koştu' zamir nedir?", a:"o"},
  {q:"'Yavaş konuştu' zarf nedir?", a:"yavaş"},
  {q:"'Kalem yazıyor' fiil nedir?", a:"yazıyor"},
  {q:"'Güzel günler' sıfat nedir?", a:"güzel"}
];

  let index = 0;

  function nextQuestion() {
  const box = document.getElementById("qaBox");
  box.innerHTML = "";

  questions.forEach((item, i) => {
    const div = document.createElement("div");
    div.style.marginBottom = "15px";

    const q = document.createElement("p");
    q.innerText = (i+1) + ") " + item.q + " ?";

    const btn = document.createElement("button");
    btn.innerText = "Cevabı Göster";

    const a = document.createElement("p");
    a.innerText = item.a;
    a.style.display = "none";

    btn.onclick = () => {
      a.style.display = a.style.display === "none" ? "block" : "none";
    };

    div.appendChild(q);
    div.appendChild(btn);
    div.appendChild(a);

    box.appendChild(div);
  });
}
</script></body>
</html>
