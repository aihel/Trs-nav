<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Lukarix Sınav Dızlamaaa</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<style>
body {
    margin:0;
    font-family:Arial;
    background: linear-gradient(135deg,#0f2027,#2c5364);
    overflow:hidden;
}

/* LOGIN */
#login {
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    background:rgba(255,255,255,0.1);
    padding:30px;
    border-radius:20px;
    text-align:center;
    backdrop-filter: blur(10px);
}

input {
    padding:10px;
    border-radius:10px;
    border:none;
}

button {
    padding:10px 20px;
    margin-top:10px;
    border:none;
    border-radius:10px;
    background:cyan;
    cursor:pointer;
}

/* APP */
#app {
    display:none;
}

/* SIDEBAR */
.sidebar {
    position:fixed;
    left:0;
    top:0;
    width:220px;
    height:100%;
    background:rgba(0,0,0,0.8);
    padding:20px;
    color:white;
    transition:0.4s;
}

.sidebar h3 {
    margin-bottom:20px;
}

.pdf-btn {
    display:block;
    margin:10px 0;
    padding:10px;
    background:rgba(255,255,255,0.1);
    border-radius:10px;
    cursor:pointer;
    transition:0.3s;
}

.pdf-btn:hover {
    background:cyan;
    color:black;
}

/* VIEWER */
.viewer {
    margin-left:240px;
    height:100vh;
    overflow:auto;
    text-align:center;
    animation:fadeIn 0.5s;
}

canvas {
    margin-top:60px;
    box-shadow:0 0 15px black;
}

/* TOP BAR */
.toolbar {
    position:fixed;
    top:0;
    left:220px;
    width:calc(100% - 220px);
    background:black;
    color:white;
    padding:10px;
}

/* ANIM */
@keyframes fadeIn {
    from {opacity:0; transform:translateY(20px);}
    to {opacity:1; transform:translateY(0);}
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login">
    <h2 style="color:white;">🔐 Giriş yap olm</h2>
    <input type="password" id="pass" placeholder="Şifre">
    <br>
    <button onclick="login()">Giriş</button>
    <p id="err" style="color:red;"></p>
</div>

<!-- APP -->
<div id="app">

    <!-- SIDEBAR -->
    <div class="sidebar">
        <h3>📚 PDF Seç(Kusura bakma senaryo geregi boyle)</h3>
        <div class="pdf-btn" onclick="openPDF('1.pdf')">Sınav dızlama</div>
        <div class="pdf-btn" onclick="openPDF('1(kopya).pdf')">Dızlama(kopya).pdf</div>
        <div class="pdf-btn" onclick="openPDF('deneme.pdf')">deneme(test).pdf</div>
    </div>

    <!-- TOOLBAR -->
    <div class="toolbar">
        <button onclick="prevPage()">⬅</button>
        <span id="pageInfo"></span>
        <button onclick="nextPage()">➡</button>
        <button onclick="zoomIn()">🔍+</button>
        <button onclick="zoomOut()">🔍-</button>
    </div>

    <!-- VIEWER -->
    <div class="viewer" id="viewer">
        <div id="pdfContainer"></div>
    </div>

</div>

<script>
let pdfDoc=null;
let pageNum=1;
let scale=1.5;

function login() {
    if(document.getElementById("pass").value === "LukarixYZ") {
        document.getElementById("login").style.display="none";
        document.getElementById("app").style.display="block";
    } else {
        document.getElementById("err").innerText="Yanlış şifre!";
    }
}

function openPDF(file) {
    pageNum=1;
    pdfjsLib.getDocument(file).promise.then(pdf=>{
        pdfDoc=pdf;
        renderPage(pageNum);
    });
}

function renderPage(num) {
    pdfDoc.getPage(num).then(page=>{
        const canvas=document.createElement("canvas");
        const ctx=canvas.getContext("2d");

        const viewport=page.getViewport({scale:scale});
        canvas.height=viewport.height;
        canvas.width=viewport.width;

        const container=document.getElementById("pdfContainer");
        container.innerHTML="";
        container.appendChild(canvas);

        page.render({canvasContext:ctx,viewport:viewport});

        document.getElementById("pageInfo").innerText=
            num+" / "+pdfDoc.numPages;
    });
}

function nextPage() {
    if(pageNum < pdfDoc.numPages){
        pageNum++;
        renderPage(pageNum);
    }
}

function prevPage() {
    if(pageNum > 1){
        pageNum--;
        renderPage(pageNum);
    }
}

function zoomIn(){
    scale+=0.2;
    renderPage(pageNum);
}

function zoomOut(){
    scale-=0.2;
    renderPage(pageNum);
}
</script>

</body>
</html>
